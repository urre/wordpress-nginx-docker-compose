version: 2
updates:
  # PHP dependencies (Bedrock / WordPress core, plugins, tooling)
  - package-ecosystem: "composer"
    directory: "/src"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Docker base images (Dockerfile + docker-compose.yml)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # GitHub Actions used in CI workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # npm dependencies for the bundled theme
  - package-ecosystem: "npm"
    directory: "/src/web/app/themes/twentytwentyone"
    schedule:
      interval: "weekly"
